# Prometheus scrapes the broker's view (Kafka exporter: offsets, consumer group lag) and
# the job's view (Flink's Prometheus reporter on the job and task managers).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]
