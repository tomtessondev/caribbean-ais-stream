# Kafka and the AIS producers on a laptop.
#   docker compose up -d                         synthetic traffic, no account needed
#   docker compose --profile live up -d live     the real feed (AISSTREAM_API_KEY in .env)
# Kafka UI on http://localhost:8088, Kafka on localhost:9094 from the host, Schema Registry
# on http://localhost:8081.

x-app: &app
  build: .
  image: caribbean-ais-stream
  environment:
    KAFKA_BOOTSTRAP: kafka:9092
    SCHEMA_REGISTRY_URL: http://schema-registry:8081

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Containers use kafka:9092, the host uses localhost:9094.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The image defaults to /tmp: without this the volume below stays empty and every
      # `docker compose down` silently wipes the topics.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # The contract of the records: Avro schemas (src/ais_stream/schemas/), stored in the
  # broker's _schemas topic, on http://localhost:8081.
  schema-registry:
    image: confluentinc/cp-schema-registry:7.9.0
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  # Registers the schemas (refusing an incompatible change) and creates the topics, on
  # every start, before anything is produced.
  topics:
    <<: *app
    command: ["topics"]
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  demo:
    <<: *app
    command: ["demo"]
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  live:
    <<: *app
    profiles: ["live"]
    command: ["live"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Required by `ais-stream live`, which refuses to start without it.
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  # The read-only JSON endpoint the site's live map polls (src/ais_stream/api.py), on
  # http://localhost:8089/v1/ships. It reads PostgreSQL as site_reader, select only.
  api:
    <<: *app
    profiles: ["live"]
    command: ["api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SITE_DATABASE_URL: postgresql://site_reader:${SITE_DB_PASSWORD:-site-local}@postgres:5432/ais
    ports:
      - "8089:8000"
    depends_on:
      db-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: antilles
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # Decodes the Avro messages and lists the schemas.
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ais
      POSTGRES_DB: ais
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais -d ais"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  # Applies postgres/init.sql on every start, not only on an empty volume: a database from
  # an older version gets the newer tables before the Flink job writes to them.
  db-schema:
    image: postgres:17.6
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-h", "postgres", "-U", "ais", "-d", "ais", "-f", "/init.sql"]
    environment:
      PGPASSWORD: ais
      # Passwords of the read-only roles Grafana and the site's endpoint use.
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-local}
      SITE_DB_PASSWORD: ${SITE_DB_PASSWORD:-site-local}
    volumes:
      - ./postgres/init.sql:/init.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # The broker's view for Prometheus: offsets per partition (throughput) and the lag of
  # every consumer group, which stays measurable while a consumer is down.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - kafka-exporter
    restart: unless-stopped

  # Map of the ships and stream health on http://localhost:3002 (3001 is taken by the
  # sensor project's Grafana).
  grafana:
    image: grafana/grafana:12.3.0
    environment:
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana-local}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Local demo: dashboards readable without logging in; editing still needs admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ais-traffic.json
    ports:
      - "3002:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  flink-jobmanager:
    build: ./flink
    image: caribbean-ais-flink
    command: ["jobmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    ports:
      - "8082:8081"   # Flink web UI on localhost:8082
    restart: unless-stopped

  flink-taskmanager:
    build: ./flink
    image: caribbean-ais-flink
    command: ["taskmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    depends_on:
      - flink-jobmanager
    restart: unless-stopped

  # Submits flink/sql/ais_jobs.sql once; the job then runs on the cluster.
  flink-jobs:
    build: ./flink
    image: caribbean-ais-flink
    command: ["bin/sql-client.sh", "-f", "/opt/flink/sql/ais_jobs.sql"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    depends_on:
      flink-taskmanager:
        condition: service_started
      db-schema:
        condition: service_completed_successfully
      topics:
        condition: service_completed_successfully

volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
