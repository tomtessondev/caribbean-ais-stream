# Kafka and the AIS producers on a laptop.
#   docker compose up -d                         synthetic traffic, no account needed
#   docker compose --profile live up -d live     the real feed (AISSTREAM_API_KEY in .env)
# Kafka UI on http://localhost:8088, Kafka on localhost:9094 from the host.

x-app: &app
  build: .
  image: caribbean-ais-stream
  environment:
    KAFKA_BOOTSTRAP: kafka:9092

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Containers use kafka:9092, the host uses localhost:9094.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # The image defaults to /tmp: without this the volume below stays empty and every
      # `docker compose down` silently wipes the topics.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  topics:
    <<: *app
    command: ["topics"]
    depends_on:
      kafka:
        condition: service_healthy

  demo:
    <<: *app
    command: ["demo"]
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  live:
    <<: *app
    profiles: ["live"]
    command: ["live"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      # Required by `ais-stream live`, which refuses to start without it.
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: antilles
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ais
      POSTGRES_PASSWORD: ais
      POSTGRES_DB: ais
    ports:
      - "5434:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ais -d ais"]
      interval: 2s
      retries: 30
    restart: unless-stopped

  flink-jobmanager:
    build: ./flink
    image: caribbean-ais-flink
    command: ["jobmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: file:///tmp/flink-checkpoints
    ports:
      - "8082:8081"   # Flink web UI on localhost:8082
    restart: unless-stopped

  flink-taskmanager:
    build: ./flink
    image: caribbean-ais-flink
    command: ["taskmanager"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - flink-jobmanager
    restart: unless-stopped

  # Submits flink/sql/ais_jobs.sql once; the job then runs on the cluster.
  flink-jobs:
    build: ./flink
    image: caribbean-ais-flink
    command: ["bin/sql-client.sh", "-f", "/opt/flink/sql/ais_jobs.sql"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
    depends_on:
      flink-taskmanager:
        condition: service_started
      postgres:
        condition: service_healthy
      topics:
        condition: service_completed_successfully

volumes:
  kafka-data:
  postgres-data:
