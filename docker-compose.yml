# Kafka and the AIS producers on a laptop.
#   docker compose up -d                         synthetic traffic, no account needed
#   docker compose --profile live up -d live     the real feed (AISSTREAM_API_KEY in .env)
# Kafka UI on http://localhost:8088, Kafka on localhost:9094 from the host.

x-app: &app
  build: .
  image: caribbean-ais-stream
  environment:
    KAFKA_BOOTSTRAP: kafka:9092

services:
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      # Containers use kafka:9092, the host uses localhost:9094.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  topics:
    <<: *app
    command: ["topics"]
    depends_on:
      kafka:
        condition: service_healthy

  demo:
    <<: *app
    command: ["demo", "--hours", "24"]
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  live:
    <<: *app
    profiles: ["live"]
    command: ["live"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      # Required by `ais-stream live`, which refuses to start without it.
      AISSTREAM_API_KEY: ${AISSTREAM_API_KEY:-}
    depends_on:
      topics:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    environment:
      KAFKA_CLUSTERS_0_NAME: antilles
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka-data:
