[project]
name = "caribbean-ais-stream"
version = "0.1.0"
description = "Real-time ship traffic (AIS) around the Lesser Antilles: Kafka and Flink"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tom Tesson" }]
dependencies = [
    "confluent-kafka>=2.5",
    "pydantic>=2.8",
    "typer>=0.12",
    "websockets>=13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    # Integration tests run a real Kafka broker (apache/kafka) in Docker; e2e tests read
    # the Flink results in PostgreSQL.
    "psycopg[binary]>=3.2",
    "testcontainers>=4.8",
]

[project.scripts]
ais-stream = "ais_stream.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ais_stream"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ais_stream --cov-report=term-missing"
markers = [
    "integration: needs Docker (a real Kafka broker)",
    "e2e: needs the Compose stack running (make e2e-up)",
]
