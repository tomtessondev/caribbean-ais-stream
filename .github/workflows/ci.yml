name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -m "not integration and not e2e"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # testcontainers starts an apache/kafka broker and PostgreSQL on the runner's Docker.
      - run: pytest -m integration --no-cov

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t caribbean-ais-stream .
      - run: docker run --rm caribbean-ais-stream --help

  # The whole streaming path on the Compose stack: producer → Kafka → Flink SQL → PostgreSQL.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Start Kafka, PostgreSQL, Flink, Prometheus and Grafana (the tests submit the SQL job)
        run: make e2e-up
      - run: make e2e
      - name: Flink logs on failure
        if: failure()
        run: docker compose logs flink-jobmanager flink-taskmanager flink-jobs
