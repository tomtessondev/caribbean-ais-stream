apiVersion: 1

datasources:
  - name: PostgreSQL
    uid: postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    # Read-only role created by postgres/init.sql; its password comes from the environment.
    user: grafana_reader
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      database: ais
      sslmode: disable
      postgresVersion: 1700
    isDefault: true
    editable: false
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    jsonData:
      timeInterval: 15s
    editable: false
